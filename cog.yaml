# Studios VS AI — voice trainer (RVC v2), fixed version of
# zsxkib/voice-cloning-training (the original replicate/train-rvc-model, which
# Replicate disabled because its setup kept failing).
#
# What changed vs. the original:
#  - every library pinned to the versions that worked in 2023 (unpinned ones
#    had moved on and broke the build / training)
#  - the base weights (pretrained 40k/48k v2, HuBERT, RMVPE) are downloaded
#    from Hugging Face while the image is BUILT, so starting the model never
#    depends on an outside download (the old weights.replicate.delivery links
#    are gone — that is what broke the original's setup)
#  - fairseq / pyworld compiled after numpy, Cython and torch are installed
#    (Cog's dependency stage has no compiler) and with an older pip
#  - unused web-UI packages (gradio, fastapi, onnxruntime…) removed
build:
  gpu: true
  cuda: "11.8"
  python_version: "3.9"
  system_packages:
    - "ffmpeg"
    - "libgl1"
    - "libglib2.0-0"
    - "curl"
    - "build-essential"
    - "pkg-config"
    - "libavformat-dev"
    - "libavcodec-dev"
    - "libavdevice-dev"
    - "libavutil-dev"
    - "libswscale-dev"
    - "libswresample-dev"
    - "libavfilter-dev"
  # Every library is installed here (not with python_packages): Cog builds
  # python_packages in a separate stage without a compiler, and some of these
  # libraries have no ready-made package for Python 3.9 and must be compiled.
  run:
    - pip install "pip<24.1" "setuptools<70" wheel
    - pip install torch==2.1.1 torchaudio==2.1.1 --index-url https://download.pytorch.org/whl/cu118
    - pip install numpy==1.23.5 Cython==3.0.6
    - pip install numba==0.56.4 llvmlite==0.39.0 scipy==1.11.4 librosa==0.9.1 resampy==0.4.2 soundfile==0.12.1 audioread==3.0.1 joblib==1.3.2 scikit-learn==1.3.2 faiss-cpu==1.7.3 tensorboard==2.15.1 tensorboardX==2.6.2.2 matplotlib==3.7.3 ffmpeg-python==0.2.0 pydub==0.25.1 python-dotenv==1.0.0 tqdm==4.66.1 json5==0.9.14 PyYAML==6.0.1
    - pip install praat-parselmouth==0.4.3 torchcrepe==0.0.20
    - pip install av==11.0.0 || pip install "av<13"
    - pip install --no-build-isolation pyworld==0.3.4 || pip install --no-build-isolation pyworld==0.3.2
    - pip install --no-build-isolation fairseq==0.12.2
    - pip install numpy==1.23.5 && python -c "import torch, fairseq, pyworld, parselmouth, faiss, librosa, av; print('libs ok', torch.__version__)"
    - mkdir -p /rvc-weights
    - curl -fL --retry 5 -o /rvc-weights/f0G48k.pth https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2/f0G48k.pth
    - curl -fL --retry 5 -o /rvc-weights/f0D48k.pth https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2/f0D48k.pth
    - curl -fL --retry 5 -o /rvc-weights/f0G40k.pth https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2/f0G40k.pth
    - curl -fL --retry 5 -o /rvc-weights/f0D40k.pth https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2/f0D40k.pth
    - curl -fL --retry 5 -o /rvc-weights/hubert_base.pt https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base.pt
    - curl -fL --retry 5 -o /rvc-weights/rmvpe.pt https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/rmvpe.pt

predict: "predict.py:Predictor"
